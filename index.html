<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mais Hidro — Portal Interativo | Versão compacta refinada</title>
<style>
:root{--navy:#112941;--navy2:#173a58;--cyan:#008cb8;--line:#dfeaf3;--muted:#8094a9;--canvas:#f3f7fb;--font:Inter,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);font-family:var(--font);color:var(--navy);font-size:14px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,.quickcard:focus-visible{outline:3px solid #31b5d7;outline-offset:3px}
header{height:88px;background:#fff;border-bottom:1px solid #e5edf5;display:flex;align-items:center;position:sticky;top:0;z-index:20}
header:before{content:"";position:absolute;top:0;height:3px;width:100%;background:linear-gradient(90deg,#112941 0%,#108cba 65%,#30c4dc 100%)}
.header-inner{width:min(1186px,calc(100% - 48px));margin:auto;display:flex;align-items:center;gap:18px;height:100%}
.logo{width:103px;height:73px;object-fit:contain;object-position:center;display:block}
.brand-div{height:34px;width:1px;background:#dbe5ee}.brand-text{display:flex;flex-direction:column;gap:5px;margin-right:auto}.brand-text strong{font-weight:750;font-size:15px;letter-spacing:-.3px}.brand-text span{font-size:9px;font-weight:850;letter-spacing:2.1px;color:#8ca0b3}
.header-actions{display:flex;gap:10px;align-items:center}.header-search{min-width:250px;height:40px;border:1px solid #dfeaf3;background:#f7fafc;border-radius:13px;display:flex;align-items:center;gap:9px;color:#8da2b5;padding:0 12px}.header-search svg{width:17px}.header-search span{font-size:12px}.key{margin-left:auto;font-size:10px;font-weight:750;border:1px solid #dce6ee;border-radius:5px;padding:3px 5px;color:#90a1b2;background:#fff}
.mode-switch{background:#f0f5f9;border:1px solid #dce6f0;padding:4px;display:flex;border-radius:14px;gap:2px}.mode-switch button{padding:9px 17px;font-size:12px;font-weight:800;color:#738aa0;border:0;background:transparent;border-radius:10px}.mode-switch button.active{background:#112b47;color:white;box-shadow:0 3px 7px #0b284623}
main{width:min(1186px,calc(100% - 48px));margin:auto;padding:20px 0 48px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.quickcard{height:154px;grid-column:span 1;position:relative;border-radius:18px;border:1px solid var(--card-line);background:var(--card-bg);overflow:hidden;box-shadow:0 12px 26px rgba(15,45,76,.035);isolation:isolate;transition:transform .22s ease,box-shadow .22s ease,border .22s ease;cursor:pointer}
.quickcard:hover,.quickcard.selected{transform:translateY(-3px);box-shadow:0 20px 38px rgba(24,66,106,.12);border-color:var(--card-color)}
.quickcard:after{content:"";height:4px;width:0;position:absolute;top:0;left:0;background:var(--card-color);transition:width .25s}.quickcard:hover:after,.quickcard.selected:after{width:100%}
.quickcard.wide{grid-column:span 1}.quickcard.only{grid-column:1/-1;height:126px}
.visual-disc{position:absolute;right:-59px;top:-78px;bottom:auto;width:170px;height:170px;border-radius:50%;background:var(--card-circle);z-index:-1;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.quickcard:hover .visual-disc,.quickcard.selected .visual-disc{transform:scale(1.07) translateY(-4px)}
.visual-icon{position:absolute;right:12px;top:38px;bottom:auto;width:58px;height:58px;color:var(--card-color);opacity:.5;transition:transform .25s ease,opacity .25s}.visual-icon svg{width:100%;height:100%;stroke-width:1.7}.quickcard:hover .visual-icon,.quickcard.selected .visual-icon{transform:scale(1.075) rotate(-4deg);opacity:.8}
.card-no{position:absolute;right:17px;top:15px;font-size:12px;font-weight:800;letter-spacing:1.5px;color:#a7b8c8}
.favorite{position:absolute;top:15px;left:16px;border:1px solid #ffffff77;background:#ffffff9c;height:31px;width:31px;border-radius:9px;display:grid;place-items:center;color:#4d7188;opacity:.0;transform:translateY(-4px);transition:all .18s;z-index:2}.quickcard:hover .favorite,.quickcard.selected .favorite,.favorite.is-fav{opacity:1;transform:none}.favorite.is-fav{color:#c68a26}.favorite svg{width:17px;height:17px}
.card-content{position:absolute;bottom:16px;left:16px;z-index:1;max-width:calc(100% - 32px)}.card-content strong{display:block;font-size:13px;line-height:1.28;font-weight:800;letter-spacing:-.25px;margin-bottom:7px}.card-content p{font-size:11px;color:#627e94;margin:0}
.card-action{position:absolute;bottom:12px;left:16px;display:flex;align-items:center;gap:6px;opacity:0;transform:translateY(5px);transition:all .2s;color:#075b89;font-size:11px;font-weight:850;z-index:3}.card-action svg{width:15px;height:15px}
.quickcard:hover .card-content,.quickcard.selected .card-content{transform:translateY(-22px)}.card-content{transition:transform .2s}.quickcard:hover .card-action,.quickcard.selected .card-action{opacity:1;transform:none}
.quickcard.only .visual-disc{width:275px;height:275px;right:-34px;top:auto;bottom:-145px}.quickcard.only .visual-icon{right:50px;top:auto;bottom:14px;width:80px;height:80px}
.quickcard.only .card-content{max-width:80%}.quickcard.only .card-content strong{font-size:15px}.quickcard.only .card-content p{font-size:12px}
.section-head{display:flex;align-items:end;justify-content:space-between;margin-top:16px;margin-bottom:14px;gap:15px}.sect-title{display:flex;align-items:center;gap:13px}.sect-mark{width:4px;background:linear-gradient(#29c2df,#087fb4);height:36px;border-radius:4px}.sect-title h2{font-size:22px;letter-spacing:-.7px;line-height:1.1;margin:0 0 6px}.sect-title p{font-size:12px;color:#7e92a7;margin:0}
.tools{display:flex;align-items:center;gap:9px}.search-input{height:40px;width:245px;border:1px solid #dce7f1;border-radius:12px;background:#fff;display:flex;align-items:center;gap:9px;padding:0 12px;color:#9caebe}.search-input svg{height:16px;width:16px;flex-shrink:0}.search-input input{font-size:12px;color:#112941;border:0;background:transparent;outline:none;min-width:0;flex:1;width:100%}.search-input input::placeholder{color:#9eb0c0}
.icon-button{height:40px;width:42px;border:1px solid #dce7f1;border-radius:12px;background:#fff;color:#506e88;display:grid;place-items:center}.icon-button:hover{background:#ecf9fc;border-color:#a6dae6}.icon-button svg{width:18px;height:18px}
.deptcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.deptcol{display:flex;flex-direction:column;gap:14px}.dept{background:#fff;border:1px solid #e0e9f2;border-radius:18px;box-shadow:0 8px 25px rgba(26,62,96,.035);overflow:hidden;transition:box-shadow .2s,border .2s}.dept.open{border-color:#a6d9eb;box-shadow:0 14px 28px rgba(10,78,121,.07)}.dept-head{width:100%;border:0;background:transparent;display:flex;gap:13px;align-items:center;text-align:left;padding:15px 17px;color:#112941;min-height:80px}.dept-tile{width:44px;height:44px;flex-shrink:0;border-radius:13px;background:#eaf4f8;color:#267a9f;display:grid;place-items:center}.dept-tile svg{width:22px;height:22px}.dept-text{flex:1;min-width:0}.dept-text strong{font-size:13px;letter-spacing:-.1px;display:block;margin-bottom:5px;font-weight:800}.dept-text small{font-size:11px;color:#8ca0b2;display:block}.dept-chevron{width:17px;height:17px;color:#8199ac;transition:transform .2s}.dept.open .dept-chevron{transform:rotate(180deg);color:#008cb8}.dept-items{display:none;margin:0 17px 9px;padding-top:7px;border-top:1px solid #eaf0f5}.dept.open .dept-items{display:block}.dept-link{padding:12px 3px;display:flex;align-items:center;gap:12px;font-size:12px;color:#526b81;border:0;background:none;width:100%;text-align:left;border-radius:8px}.dept-link:hover{background:#f4fafd;color:#035f89}.dept-link>span:first-child{color:#112f4a;font-weight:800;font-size:15px}.dept-link .detail{flex:1}.pill{font-size:10px;color:#ae761c;font-weight:800;background:#fff5e5;border:1px solid #ffe8bb;border-radius:7px;padding:5px 8px;white-space:nowrap}.dept-link.construct>span:first-child{color:#d0961e}.dept-link.construct{color:#927043}
.status-free{display:flex;gap:7px;align-items:center;color:#8197aa;font-size:11px;max-width:100%;margin-top:20px}.status-free svg{height:14px;width:14px;color:#0b97c4}
.toast{position:fixed;right:25px;bottom:25px;padding:15px 20px;border-radius:12px;color:#fff;background:#143450;box-shadow:0 14px 36px #183d5a44;z-index:50;font-size:13px;opacity:0;pointer-events:none;transform:translateY(20px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
/* important responsive behavior */
@media (max-width:900px){.header-search{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.quickcard,.quickcard.wide{grid-column:span 1;height:150px}.quickcard.only{grid-column:1/-1}.quickcard:last-child:nth-child(odd){grid-column:span 2}.card-content strong{font-size:14px}}
@media (max-width:620px){header{height:82px}.header-inner,main{width:calc(100% - 28px)}.logo{height:60px;width:80px}.brand-div{height:30px}.brand-text strong{font-size:12px}.brand-text span{font-size:8px;letter-spacing:1px}.header-inner{gap:10px}.mode-switch button{padding:7px 9px}.header-actions{gap:4px}main{padding-top:14px}.cards{grid-template-columns:1fr;gap:10px}.quickcard,.quickcard.wide,.quickcard.only,.quickcard:last-child:nth-child(odd){grid-column:span 1;height:144px}.visual-disc{height:225px;width:225px;right:-52px;top:auto;bottom:-104px}.visual-icon{right:12px;top:auto;bottom:8px;height:70px;width:70px}.card-content{left:18px;bottom:22px;max-width:calc(100% - 115px)}.card-content strong{font-size:13px}.section-head{align-items:stretch;flex-direction:column;gap:14px}.sect-title h2{font-size:20px}.tools{width:100%}.search-input{flex:1}.deptcols{grid-template-columns:1fr}.favorite{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Esconde apenas o indicador visual de rolagem, sem bloquear o scroll. */
html, body { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; display: none; }
</style></head>

function renderCards(){const cards=entries.filter(e=>e.mode===mode); const target=document.querySelector('#cards');target.innerHTML=cards.map((c,i)=>`<article class="quickcard ${cards.length===1?'only':''}" tabindex="0" role="button" aria-label="Abrir ${c.title}" data-id="${c.id}" style="--card-color:${c.color};--card-bg:${c.bg};--card-circle:${c.circle};--card-line:${c.line}">

 target.querySelectorAll('.favorite').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const id=btn.closest('[data-id]').dataset.id;favorites.has(id)?favorites.delete(id):favorites.add(id);btn.classList.toggle('is-fav',favorites.has(id));toast(favorites.has(id)?'Adicionado aos favoritos nesta prévia.':'Removido dos favoritos.');});}
function renderDept(){const term=document.querySelector('#findDept').value.trim().toLocaleLowerCase('pt-BR');const filtered=depts.filter(d=>d.mode===mode && (`${d.title} ${d.sub} ${d.items.map(x=>x[1]).join(' ')}`).toLocaleLowerCase('pt-BR').includes(term));const cols=[[],[]];filtered.forEach((d,i)=>cols[i%2].push(d));
 document.querySelector('#departments').innerHTML=cols.map(col=>`<div class="deptcol">${col.map(d=>`<section class="dept ${openDepartments.has(d.id)?'open':''}" data-dept="${d.id}"><button class="dept-head" type="button" aria-expanded="${openDepartments.has(d.id)}"><span class="dept-tile">${icon(d.icon)}</span><span class="dept-text"><strong>${d.n} ${d.title}</strong><small>${d.sub}</small></span><span class="dept-chevron">${icon('chevron',17)}</span></button><div class="dept-items">${d.items.map(item=>`<button class="dept-link ${item[2]?'construct':''}" type="button"><span>→</span><span class="detail">${item[0]?item[0]+' · ':''}${item[1]}</span>${item[2]?'<span class="pill">EM CONSTRUÇÃO</span>':''}</button>`).join('')}</div></section>`).join('')}</div>`).join('');
 document.querySelectorAll('.dept-head').forEach(b=>b.onclick=()=>{const id=b.closest('[data-dept]').dataset.dept;openDepartments.has(id)?openDepartments.delete(id):openDepartments.add(id);renderDept()});
 document.querySelectorAll('.dept-link').forEach(b=>b.onclick=()=>toast('Prévia visual: conecte este item ao endereço do módulo.'));
}
function switchMode(x){mode=x;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===x));document.getElementById('mode-text').textContent=x;document.querySelector('#dept-subtitle').textContent=x==='ERP'?'Governança, administrativo, engenharia e produção.':'Carteira, marketing, clientes, portfólio comercial e propostas.';document.getElementById('findDept').value='';renderCards();renderDept()}
document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>switchMode(el.dataset.mode));document.querySelector('#findDept').addEventListener('input',renderDept);
document.querySelector('#globalSearch').onclick=()=>{document.querySelector('#findDept').focus();document.querySelector('#findDept').scrollIntoView({behavior:'smooth',block:'center'})};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#findDept').focus()}});

document.querySelector('.search-svg').innerHTML=icon('search',17);document.querySelector('#smallSearch').innerHTML=icon('search',17);
switchMode('ERP');
</script></body></html>
